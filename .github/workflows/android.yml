name: Is Agi Android APK AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android platform dosyalarini olustur
        run: flutter create --platforms android --org com.teknolojix --project-name is_agi .
      - name: Android uygulama ayarlari
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          text = text.replace('android:label="is_agi"', 'android:label="İş Ağı"')
          manifest.write_text(text)
          PY
      - name: Paketleri kur
        run: flutter pub get
      - name: Analiz
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Baglanti ayarlarini dogrula
        run: |
          python3 - <<'PY'
          import json
          from urllib.parse import urlparse
          c = json.load(open('config/client.json'))
          assert urlparse(c['SUPABASE_URL']).hostname == 'ikoyhonpgujbughdsouu.supabase.co'
          assert c['SUPABASE_ANON_KEY'].startswith('sb_publishable_')
          PY
      - name: Canli profil sorgularini dogrula
        run: python3 tool/check_profile_queries.py
      - name: APK
        run: flutter build apk --release --dart-define-from-file=config/client.json
      - name: AAB
        run: flutter build appbundle --release --dart-define-from-file=config/client.json
      - uses: actions/upload-artifact@v4
        with:
          name: is-agi-v0.1-apk-aab
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

