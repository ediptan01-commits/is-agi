name: Is Agi Yonetim Android
on:
  push:
    branches: [main]
    paths: ['admin-mobile/**', '.github/workflows/admin-android.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: admin-mobile
jobs:
  admin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android projesini olustur
        run: flutter create --platforms android --org com.teknolojix --project-name is_agi_yonetim .
      - name: Yonetim uygulamasi ayarlari
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          text=p.read_text().replace('<application','<uses-permission android:name="android.permission.INTERNET"/>\n    <application',1)
          text=text.replace('android:label="is_agi_yonetim"','android:label="İş Ağı Yönetim" android:allowBackup="false" android:usesCleartextTraffic="false"')
          text=text.replace('@mipmap/ic_launcher','@drawable/admin_icon')
          p.write_text(text)
          icon=Path('android/app/src/main/res/drawable/admin_icon.xml')
          icon.parent.mkdir(parents=True,exist_ok=True)
          icon.write_text('<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#152b45" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#ffffff" android:pathData="M54,20L82,31v22c0,18 -12,30 -28,37C38,83 26,71 26,53V31z"/><path android:fillColor="#245de9" android:pathData="M40,52l9,9 20,-22 6,6 -26,29 -15,-16z"/></vector>')
          PY
      - run: flutter pub get
      - name: Analiz
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: APK
        run: flutter build apk --release --dart-define-from-file=config/client.json
      - name: AAB
        run: flutter build appbundle --release --dart-define-from-file=config/client.json
      - uses: actions/upload-artifact@v4
        with:
          name: is-agi-yonetim-v1.0.0-apk-aab
          path: |
            admin-mobile/build/app/outputs/flutter-apk/app-release.apk
            admin-mobile/build/app/outputs/bundle/release/app-release.aab
            admin-mobile/pubspec.lock
          if-no-files-found: error
          retention-days: 14

